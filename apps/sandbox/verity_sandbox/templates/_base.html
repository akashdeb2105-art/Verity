<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AP Sandbox{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 24px;
           background: #0c0c0d; color: #f2f0ec; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .note { color: #6b6862; font-size: 12px; margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #2a2a2e; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a3a099; }
    td { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 13px; }
    nav a { color: #a3a099; margin-right: 16px; font-size: 12px; }
  </style>
</head>
<body>
  <nav>
    <a href="/ui/inbox">Inbox</a>
    <a href="/ui/purchase-orders/PO-2211">Purchase orders</a>
    <a href="/ui/bills">Ledger</a>
  </nav>
  <h1>{% block heading %}{% endblock %}</h1>
  <p class="note">Synthetic sandbox data. Every vendor, amount and document here is invented.</p>
  {% block content %}{% endblock %}
</body>
</html>
