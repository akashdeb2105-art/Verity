[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verity"
version = "0.0.1"
description = "Your AI agent says DONE. Verity checks whether it actually did."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Verity contributors" }]
keywords = ["verification", "outcome-contract", "evidence", "automation", "agents", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Testing",
]

# Dependency discipline (see docs/adr/0008-dependency-policy.md).
# Every entry below is load-bearing for M0. No LLM SDK appears here, by design:
# the verifier is deterministic and makes zero model calls.
dependencies = [
  "pydantic>=2.7,<3",       # typed artifact models; the schema IS the product
  "PyYAML>=6.0,<7",         # contracts are git-friendly YAML
  "httpx>=0.27,<1",         # connector transport
]

[project.optional-dependencies]
sandbox = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "jinja2>=3.1.6,<4",         # sandbox HTML UI -- needed for the independent-channel story
  "reportlab>=4.1,<5",      # deterministic invoice PDF generation (BSD-3)
]
extract = [
  "pdfplumber>=0.11.10,<1",    # PDF text+layout with per-word bounding boxes (MIT)
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "import-linter>=2.0",
  "types-PyYAML",
]

[project.scripts]
verity = "verity_cli.main:main"

[project.urls]
Homepage = "https://github.com/akashdeb2105-art/Verity"
Source = "https://github.com/akashdeb2105-art/Verity"

# ---------------------------------------------------------------------------
# One distribution, six top-level modules. The architectural boundary that
# matters (verifier must not depend on any executor) is enforced by
# import-linter in CI, not by distribution packaging. See ADR-0006.
# ---------------------------------------------------------------------------
# PEP 561: every module ships a py.typed marker, so downstream consumers get
# our type information instead of falling back to Any.
[tool.hatch.build.targets.wheel]
artifacts = ["**/py.typed"]
packages = [
  "packages/schema/verity_schema",
  "packages/evidence/verity_evidence",
  "packages/connectors/verity_connectors",
  "packages/extract/verity_extract",
  "packages/verifier/verity_verifier",
  "packages/cli/verity_cli",
  "apps/sandbox/verity_sandbox",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests and in internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"apps/sandbox/**" = ["S104"]  # sandbox binds 127.0.0.1 by default; documented

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
mypy_path = "packages/schema:packages/evidence:packages/connectors:packages/extract:packages/verifier:packages/cli:apps/sandbox"
exclude = ["^tests/", "^bench/"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/schema", "packages/evidence", "packages/connectors",
  "packages/extract", "packages/verifier", "packages/cli", "apps/sandbox",
]
addopts = "-q --strict-markers"
markers = [
  "determinism: repeated-run determinism guarantees",
  "security: security invariants (injection, redaction, zero-egress)",
  "slow: slower integration tests",
]
